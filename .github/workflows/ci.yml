name: Validate Expense Quest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated MongoDB replica set for API integration tests
        run: |
          docker run --detach --name expense-quest-test-mongo --publish 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec expense-quest-test-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec expense-quest-test-mongo mongosh --quiet --eval 'try { rs.status().ok } catch (error) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] }) }'
          for attempt in $(seq 1 30); do
            if mongosh 'mongodb://127.0.0.1:27017/admin?replicaSet=rs0' --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo 'MongoDB replica set did not become ready.'
          exit 1
      - name: Run backend and frontend tests
        run: npm test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/expense_quest_test_ci?replicaSet=rs0
      - name: Build production frontend
        run: npm run build
