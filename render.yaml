services:
  - type: web
    name: expense-quest-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: expense_quest
      - key: FRONTEND_ORIGIN
        value: https://expense-quest-qxabon.v2.appdeploy.ai,https://expense-quest-uz0ijy.v2.appdeploy.ai
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: MAX_CSV_ROWS
        value: "5000"
